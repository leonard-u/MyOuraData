services:
  cracked-oura:
    build:
      context: .
      dockerfile: Dockerfile
    image: cracked-oura:latest
    container_name: cracked-oura
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      # Loopback-only by default: the API has no authentication. To reach it
      # from other devices on a trusted LAN, set CRACKED_OURA_BIND=0.0.0.0 and
      # add the host name/IP you browse to to CRACKED_OURA_ALLOWED_HOSTS.
      - "${CRACKED_OURA_BIND:-127.0.0.1}:${CRACKED_OURA_PORT:-8000}:8000"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Rome}"
      CRACKED_OURA_DATA_DIR: "/data"
      CRACKED_OURA_ALLOWED_HOSTS: "${CRACKED_OURA_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${CRACKED_OURA_DATA_PATH:-./data}:/data"
